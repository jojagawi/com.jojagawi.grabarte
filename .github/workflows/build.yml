name: Setup and Build

on:
  push:
    branches: [main]
  workflow_call:
    secrets:
      AWS_ACCESS_KEY_ID:
        description: "AWS Access key"
        required: true
      AWS_SECRET_ACCESS_KEY:
        description: "AWS Secret key"
        required: true
      AWS_REGION:
        description: "AWS Region"
        required: true

jobs:
  aws-infra:
    name: Setup infrastructure in AWS
    runs-on: ubuntu-latest
    env:
      RATES_LAMBDA_BUCKET: dam.inspiraarte.com
      RATES_LAMBDA_KEY_PREFIX: lambda/rates
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        id: creds-stack
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Generate timestamp
        id: timestamp
        run: echo "value=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Build rates lambda zip
        id: rates-zip
        run: |
          mkdir -p .aws/dist
          cd .aws/lambda/rates
          zip -r ../../dist/rates-lambda.zip lambda-rates-handler.mjs
          CONTENT_HASH=$(sha256sum lambda-rates-handler.mjs | awk '{print $1}' | cut -c1-16)
          echo "artifact_key=${RATES_LAMBDA_KEY_PREFIX}/rates-lambda-${CONTENT_HASH}.zip" >> $GITHUB_OUTPUT

      - name: Upload rates lambda zip to S3
        run: |
          if aws s3api head-object --bucket "${RATES_LAMBDA_BUCKET}" --key "${{ steps.rates-zip.outputs.artifact_key }}" > /dev/null 2>&1; then
            echo "Artifact already exists. Skipping upload."
          else
            aws s3 cp \
              .aws/dist/rates-lambda.zip \
              s3://${RATES_LAMBDA_BUCKET}/${{ steps.rates-zip.outputs.artifact_key }}
          fi

      - name: Deploy to AWS CloudFormation
        id: update-stack
        uses: aws-actions/aws-cloudformation-github-deploy@v2.2.0
        with:
          name: "inspirarte-com"
          template: "./.aws/infra.yml"
          parameter-overrides: "LastUpdate=${{ steps.timestamp.outputs.value }},RatesLambdaCodeS3Key=${{ steps.rates-zip.outputs.artifact_key }}"
          capabilities: "CAPABILITY_NAMED_IAM, CAPABILITY_AUTO_EXPAND"

  static-site:
    name: Validate and build static-site
    runs-on: ubuntu-latest
    needs: aws-infra

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        id: creds-stack
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Build project
        run: pnpm run build:all

      - uses: osiegmar/s3-publisher-action@v3
        with:
          bucket: www.inspiraarte.com
          dir: out
          delete-orphaned: true
          wait-before-delete: 3000
          cache-control: |
            **/*.webp = public, max-age=31536000, immutable
            **/*.html = public, max-age=300
            **/* = public, max-age=31536000, immutable

      - uses: osiegmar/s3-publisher-action@v3
        with:
          bucket: dam.inspiraarte.com
          dir: dam
          delete-orphaned: false
          cache-control: |
            **/*.webp = public, max-age=31536000, immutable
            **/*.html = public, max-age=300
            **/* = public, max-age=31536000, immutable
