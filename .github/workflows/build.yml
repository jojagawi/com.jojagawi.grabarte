name: Setup and Build

on:
  push:
    branches: [main]
  workflow_call:
    secrets:
      AWS_ACCESS_KEY_ID:
        description: "AWS Access key"
        required: true
      AWS_SECRET_ACCESS_KEY:
        description: "AWS Secret key"
        required: true
      AWS_REGION:
        description: "AWS Region"
        required: true

jobs:
  aws-infra:
    name: Setup infrastructure in AWS
    runs-on: ubuntu-latest
    # Los secretos del environment Prod (HUBSPOTAPIKEY, SLACKWEBHOOKURL, NEXT_GOOGLE_SECRET_KEY…)
    # solo llegan a los jobs que lo declaran; sin esto se leen vacíos.
    environment: Prod
    env:
      S3_LAMBDA_BUCKET: dam.inspiraarte.com
      RATES_LAMBDA_KEY_PREFIX: lambda/rates
      CONTACT_LAMBDA_KEY_PREFIX: lambda/contact
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        id: creds-stack
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Generate timestamp
        id: timestamp
        run: echo "value=$(date +%s)" >> $GITHUB_OUTPUT


      # Los nombres deben coincidir con los que lee cada handler (HUBSPOT_API, no HUBSPOT_API_KEY).
      # Los secretos van por env: y no dentro del script, para que comillas o $ no rompan el .env.
      - name: Set secrets in lambda
        env:
          HUBSPOT_API: ${{ secrets.HUBSPOTAPIKEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACKWEBHOOKURL }}
          NEXT_GOOGLE_SECRET_KEY: ${{ secrets.NEXT_GOOGLE_SECRET_KEY }}
        run: |
          for name in HUBSPOT_API SLACK_WEBHOOK_URL NEXT_GOOGLE_SECRET_KEY; do
            # Un secreto inexistente llega vacío sin error: se avisa en el resumen del run.
            [ -n "${!name}" ] || echo "::warning title=Secreto vacio::${name} llega vacio; la Lambda de contacto lo omitira."
          done
          # Comillas simples: el valor queda literal (un # sin comillas se leería como comentario).
          printf "%s='%s'\n" \
            HUBSPOT_API "$HUBSPOT_API" \
            SLACK_WEBHOOK_URL "$SLACK_WEBHOOK_URL" \
            NEXT_GOOGLE_SECRET_KEY "$NEXT_GOOGLE_SECRET_KEY" > .aws/lambda/contact/.env
          printf "%s='%s'\n" NEXT_GOOGLE_SECRET_KEY "$NEXT_GOOGLE_SECRET_KEY" > .aws/lambda/rates/.env



      - name: Build rates lambda zip
        id: rates-zip
        run: |
          mkdir -p .aws/dist
          cd .aws/lambda/rates
          zip -r ../../dist/rates-lambda.zip lambda-rates-handler.mjs
          zip -ur ../../dist/rates-lambda.zip .env
          CONTENT_HASH=$(sha256sum ../../dist/rates-lambda.zip | awk '{print $1}' | cut -c1-16)
          echo "artifact_key=${RATES_LAMBDA_KEY_PREFIX}/rates-lambda-${CONTENT_HASH}.zip" >> $GITHUB_OUTPUT

      - name: Upload rates lambda zip to S3
        run: |
          if aws s3api head-object --bucket "${S3_LAMBDA_BUCKET}" --key "${{ steps.rates-zip.outputs.artifact_key }}" > /dev/null 2>&1; then
            echo "Artifact already exists. Skipping upload."
          else
            aws s3 cp \
              .aws/dist/rates-lambda.zip \
              s3://${S3_LAMBDA_BUCKET}/${{ steps.rates-zip.outputs.artifact_key }}
          fi

      - name: Build contact lambda zip
        id: contact-zip
        run: |
          mkdir -p .aws/dist
          cd .aws/lambda/contact
          zip -r ../../dist/contact-lambda.zip lambda-contact-handler.mjs
          zip -ur ../../dist/contact-lambda.zip .env
          # El hash incluye el .env: si solo cambian los secretos, la llave del zip cambia y
          # CloudFormation actualiza la Lambda (con la misma llave omitiría la subida y el cambio).
          CONTENT_HASH=$(cat ../../dist/contact-lambda.zip .env | sha256sum | awk '{print $1}' | cut -c1-16)
          echo "artifact_key=${CONTACT_LAMBDA_KEY_PREFIX}/contact-lambda-${CONTENT_HASH}.zip" >> $GITHUB_OUTPUT

      - name: Upload contact lambda zip to S3
        run: |
          if aws s3api head-object --bucket "${S3_LAMBDA_BUCKET}" --key "${{ steps.contact-zip.outputs.artifact_key }}" > /dev/null 2>&1; then
            echo "Artifact already exists. Skipping upload."
          else
            aws s3 cp \
              .aws/dist/contact-lambda.zip \
              s3://${S3_LAMBDA_BUCKET}/${{ steps.contact-zip.outputs.artifact_key }}
          fi

      - name: Deploy to AWS CloudFormation
        id: update-stack
        uses: aws-actions/aws-cloudformation-github-deploy@v2.2.0
        with:
          name: "inspirarte-com"
          template: "./.aws/infra.yml"
          parameter-overrides: "LastUpdate=${{ steps.timestamp.outputs.value }},
          RatesLambdaCodeS3Key=${{ steps.rates-zip.outputs.artifact_key }},
          ContactLambdaCodeS3Key=${{ steps.contact-zip.outputs.artifact_key }},
          SlackWebhookUrl=${{ secrets.SLACKWEBHOOKURL }},
          HubspotApiToken=${{ secrets.HUBSPOTAPIKEY }}"
          capabilities: "CAPABILITY_NAMED_IAM, CAPABILITY_AUTO_EXPAND"
          # Nombre único por corrida: con el nombre por defecto (inspirarte-com-CS) choca con un
          # change set viejo del mismo nombre y otros parámetros que quedó sin ejecutar en el stack
          # ("mismatch with existing attribute Parameters"). Al ejecutarse este, CloudFormation
          # borra los demás change sets del stack, incluido el viejo.
          change-set-name: "inspirarte-com-${{ github.run_id }}-${{ github.run_attempt }}"

  static-site:
    name: Validate and build static-site
    runs-on: ubuntu-latest
    environment: Prod
    needs: aws-infra

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set secrets in .env.production
        run: |
          echo "HUBSPOT_API_KEY=${{ secrets.HUBSPOTAPIKEY }}" >> .env.production
          echo "SLACK_WEBHOOK_URL=${{ secrets.SLACKWEBHOOKURL }}" >> .env.production
          echo "NEXT_PUBLIC_BUGSNAG=${{ secrets.NEXT_PUBLIC_BUGSNAG }}" >> .env.production
          echo "NEXT_CLOUDFLARE_TOKEN=${{ secrets.NEXT_CLOUDFLARE_TOKEN }}" >> .env.production
          echo "NEXT_GOOGLE_SECRET_KEY=${{ secrets.NEXT_GOOGLE_SECRET_KEY }}" >> .env.production

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        id: creds-stack
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Build project
        run: pnpm run build:all

      # Despliegue en dos pasadas para que nunca quede un HTML pidiendo chunks borrados
      # ("module factory is not available"): primero se suben los archivos (chunks antes que
      # HTML), luego se purga Cloudflare y al final se borran los huérfanos con margen.
      # Solo _next/static y las .webp llevan hash en el nombre; el resto (HTML, payloads RSC
      # index.txt, sitemap, service worker…) no puede ser immutable o se queda viejo un año.
      - name: Publish static site (sin borrar huérfanos)
        uses: osiegmar/s3-publisher-action@v3
        with:
          bucket: www.inspiraarte.com
          dir: out
          order: |
            _next/static/**/*
          cache-control: |
            _next/static/**/* = public, max-age=31536000, immutable
            **/*.webp = public, max-age=31536000, immutable
            **/* = public, max-age=300

      # Sin la purga, Cloudflare sigue sirviendo el HTML del build anterior.
      - name: Purge Cloudflare cache
        env:
          CF_TOKEN: ${{ secrets.NEXT_CLOUDFLARE_TOKEN }}
          CF_ZONE_ID: ${{ secrets.NEXT_CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::warning title=Cloudflare::NEXT_CLOUDFLARE_TOKEN vacio; no se purgo la cache."
            exit 0
          fi
          if [ -z "$CF_ZONE_ID" ]; then
            CF_ZONE_ID=$(curl -sS -H "Authorization: Bearer $CF_TOKEN" \
              "https://api.cloudflare.com/client/v4/zones?name=inspiraarte.com" | jq -r '.result[0].id // empty')
          fi
          if [ -z "$CF_ZONE_ID" ]; then
            echo "::warning title=Cloudflare::No se encontro la zona; agrega el secreto NEXT_CLOUDFLARE_ZONE_ID."
            exit 0
          fi
          RESULT=$(curl -sS -X POST -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache")
          if [ "$(echo "$RESULT" | jq -r '.success')" != "true" ]; then
            echo "::warning title=Cloudflare::La purga fallo: $(echo "$RESULT" | jq -c '.errors')"
          fi

      # Espera más que el max-age del HTML (300 s) antes de borrar: un navegador con el HTML
      # anterior en caché aún puede pedir los chunks viejos.
      - name: Delete orphaned files
        uses: osiegmar/s3-publisher-action@v3
        with:
          bucket: www.inspiraarte.com
          dir: out
          delete-orphaned: true
          wait-before-delete: 330000
          cache-control: |
            _next/static/**/* = public, max-age=31536000, immutable
            **/*.webp = public, max-age=31536000, immutable
            **/* = public, max-age=300

      - uses: osiegmar/s3-publisher-action@v3
        with:
          bucket: dam.inspiraarte.com
          dir: dam
          delete-orphaned: false
          cache-control: |
            **/*.webp = public, max-age=31536000, immutable
            **/*.html = public, max-age=300
            **/* = public, max-age=31536000, immutable
