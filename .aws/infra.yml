---
AWSTemplateFormatVersion: '2010-09-09'
Transform: 'AWS::Serverless-2016-10-31'
Description: >
  This template enable the resources

### Init Parameters
Parameters:
  AppName:
    Type: String
    Default: 'inspiraarte'
    Description: Application name, used for create resources
  Environment:
    Description: Environment type
    Type: String
    Default: prod
    AllowedValues: [ dev, stg, prod ]
  S3BucketName:
    Description: Environment type
    Type: String
    Default: www.inspiraarte.com
  DamBucketName:
    Description: Environment type
    Type: String
    Default: dam.inspiraarte.com
  ArchitecturesVar:
    Type: String
    Default: x86_64
    AllowedValues:
      - x86_64
      - arm64
  CreateAWSInfra:
    Description: Create AWS Infrastructure
    Type: String
    Default: "true"
    AllowedValues: [ "true", "false" ]
  CreateDocs:
    Description: Create JS Docs
    Type: String
    Default: "false"
    AllowedValues: [ "true", "false" ]
  CreateRatesLambda:
    Description: Create rates ingestion lambda and function URL
    Type: String
    Default: "true"
    AllowedValues: [ "true", "false" ]
  RatesLambdaCodeS3Key:
    Description: S3 key to the rates lambda zip artifact (for example lambda/rates/lambda-rates-handler.zip)
    Type: String
    Default: "lambda/rates/lambda-rates-handler.zip"
  RatesLambdaCodeS3ObjectVersion:
    Description: Optional S3 object version for immutable lambda deployments
    Type: String
    Default: ""
  RatesLambdaApiKey:
    Description: Optional shared secret validated from x-api-key header
    Type: String
    NoEcho: true
    Default: "44f2cf7f-1c5d-46bf-9cd6-6a220e308f1d"
  NextGoogleSecretKey:
    Description: Secret key for Google reCAPTCHA verification
    Type: String
    NoEcho: true
    Default: "6LdHQY4tAAAAAMZo4C5q-gj2u-kOWLFgxumPhSVD"
  RatesLambdaMemorySize:
    Description: Memory size (MB) for rates lambda
    Type: Number
    Default: 128
    MinValue: 128
    MaxValue: 10240
  RatesLambdaTimeout:
    Description: Timeout (seconds) for rates lambda
    Type: Number
    Default: 10
    MinValue: 3
    MaxValue: 30
  RatesAthenaDatabaseName:
    Description: Glue database name for site rates analytics
    Type: String
    Default: inspiraarte_rates
  RatesAthenaTableName:
    Description: Glue table name for site rates analytics
    Type: String
    Default: rates
  CreateContactLambda:
    Description: Create contact (quote requests) lambda and function URL
    Type: String
    Default: "true"
    AllowedValues: [ "true", "false" ]
  ContactLambdaCodeS3Key:
    Description: S3 key to the contact lambda zip artifact (see .aws/lambda/contact/README.md)
    Type: String
    Default: "lambda/contact/lambda-contact-handler.zip"
  ContactLambdaCodeS3ObjectVersion:
    Description: Optional S3 object version for immutable lambda deployments
    Type: String
    Default: ""
  # Los secretos de contacto no llevan valor por defecto: se pasan al desplegar.
  ContactLambdaApiKey:
    Description: Optional shared secret validated from x-api-key header
    Type: String
    NoEcho: true
    Default: ""
  HubspotApiToken:
    Description: HubSpot private app token (HUBSPOT_API). Empty skips HubSpot.
    Type: String
    NoEcho: true
    Default: "CiRuYTEtMmQwMC0yZjNhLTRmYzEtOTA5ZS0zYmQ3MmRmMGRmODQQ4fDsGBiMneYvKhkABeaRgoI9h5qZBsssRZYhFEVY9gsMACO6SgNuYTE"
  SlackWebhookUrl:
    Description: Slack incoming webhook URL (SLACK_WEBHOOK_URL). Empty skips Slack.
    Type: String
    NoEcho: true
    Default: "https://hooks.slack.com/services/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"
  ContactAllowedOrigin:
    Description: Site origin allowed to call the contact lambda and upload attachments
    Type: String
    Default: https://www.inspiraarte.com
  LastUpdate:
    Type: String
    Description: Fecha y hora de última actualización del template
Rules:
  ContactLambdaCodeParamsRequired:
    RuleCondition: !Equals
      - !Ref CreateContactLambda
      - "true"
    Assertions:
      - Assert: !Not [ !Equals [ !Ref ContactLambdaCodeS3Key, "" ] ]
        AssertDescription: ContactLambdaCodeS3Key is required when CreateContactLambda is true.
  RatesLambdaCodeParamsRequired:
    RuleCondition: !Equals
      - !Ref CreateRatesLambda
      - "true"
    Assertions:
      - Assert: !Not [ !Equals [ !Ref DamBucketName, "" ] ]
        AssertDescription: DamBucketName is required when CreateRatesLambda is true.
      - Assert: !Not [ !Equals [ !Ref RatesLambdaCodeS3Key, "" ] ]
        AssertDescription: RatesLambdaCodeS3Key is required when CreateRatesLambda is true.
Conditions:
  CreateDocsResources: !Equals
    - !Ref CreateDocs
    - "true"
  CreateRatesLambdaResources: !Equals
    - !Ref CreateRatesLambda
    - "true"
  HasRatesLambdaCodeObjectVersion: !Not [ !Equals [ !Ref RatesLambdaCodeS3ObjectVersion, "" ] ]
  HasRatesLambdaApiKey: !Not [ !Equals [ !Ref RatesLambdaApiKey, "" ] ]
  CreateContactLambdaResources: !Equals
    - !Ref CreateContactLambda
    - "true"
  HasContactLambdaCodeObjectVersion: !Not [ !Equals [ !Ref ContactLambdaCodeS3ObjectVersion, "" ] ]


Resources:
  S3PublicBucketPolicy:
    Type: 'AWS::S3::BucketPolicy'
    Properties:
      Bucket: !Ref S3Bucket
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Action: 's3:GetObject'
            Effect: Allow
            Principal: '*'
            Resource: !Join
              - ''
              - - 'arn:aws:s3:::'
                - !Ref S3Bucket
                - /*
  S3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${S3BucketName}'
      WebsiteConfiguration:
        ErrorDocument: '404.html'
        IndexDocument: 'index.html'
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      AccessControl: AwsExecRead
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      Tags:
        - Key: Servicio
          Value: !Sub '${AppName}'
        - Key: Environment
          Value: !Sub '${Environment}'
  DamBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${DamBucketName}'
      WebsiteConfiguration:
        ErrorDocument: '404.html'
        IndexDocument: 'index.html'
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      AccessControl: AwsExecRead
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      # Adjuntos de /contacto: el navegador sube con POST firmado directo al bucket.
      CorsConfiguration:
        CorsRules:
          - AllowedMethods:
              - POST
            AllowedOrigins:
              - !Ref ContactAllowedOrigin
              - http://localhost:3000
            AllowedHeaders:
              - '*'
            MaxAge: 3000
      Tags:
        - Key: Servicio
          Value: !Sub '${AppName}'
        - Key: Environment
          Value: !Sub '${Environment}'
  DamBucketPolicy:
    Type: 'AWS::S3::BucketPolicy'
    Properties:
      Bucket: !Ref DamBucket
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Action: 's3:GetObject'
            Effect: Allow
            Principal: '*'
            Resource: !Join
              - ''
              - - 'arn:aws:s3:::'
                - !Ref DamBucket
                - /preview/*
          - Action: 's3:GetObject'
            Effect: Deny
            Principal: '*'
            Resource: !Join
              - ''
              - - 'arn:aws:s3:::'
                - !Ref DamBucket
                - /docs/*
          - Action: 's3:GetObject'
            Effect: Allow
            Principal: '*'
            Resource: !Join
              - ''
              - - 'arn:aws:s3:::'
                - !Ref DamBucket
                - /robots.txt
  DamBucketAccessUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Sub '${AppName}-${Environment}-dam-user'
      Tags:
        - Key: Servicio
          Value: !Sub '${AppName}'
        - Key: Environment
          Value: !Sub '${Environment}'
  DamBucketAccessPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub '${AppName}-${Environment}-dam-bucket-access'
      Users:
        - !Ref DamBucketAccessUser
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: DamBucketListAccess
            Effect: Allow
            Action:
              - 's3:ListBucket'
              - 's3:GetBucketLocation'
            Resource: !Sub 'arn:aws:s3:::${DamBucket}'
          - Sid: DamBucketObjectAccess
            Effect: Allow
            Action:
              - 's3:GetObject'
              - 's3:PutObject'
              - 's3:DeleteObject'
              - 's3:GetObjectAcl'
              - 's3:PutObjectAcl'
              - 's3:AbortMultipartUpload'
              - 's3:ListMultipartUploadParts'
            Resource: !Sub 'arn:aws:s3:::${DamBucket}/*'
          - Sid: RatesAthenaQueryAccess
            Effect: Allow
            Action:
              - 'athena:GetQueryExecution'
              - 'athena:GetQueryResults'
              - 'athena:StartQueryExecution'
              - 'athena:StopQueryExecution'
              - 'athena:GetWorkGroup'
            Resource:
              - !Sub 'arn:aws:athena:${AWS::Region}:${AWS::AccountId}:workgroup/${RatesAthenaWorkGroup}'
          - Sid: RatesGlueCatalogReadAccess
            Effect: Allow
            Action:
              - 'glue:GetDatabase'
              - 'glue:GetDatabases'
              - 'glue:GetTable'
              - 'glue:GetTables'
              - 'glue:GetPartition'
              - 'glue:GetPartitions'
            Resource:
              - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog'
              - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/${RatesAthenaDatabaseName}'
              - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/${RatesAthenaDatabaseName}/${RatesAthenaTableName}'
  S3BucketDocs:
    Type: AWS::S3::Bucket
    Condition: CreateDocsResources
    Properties:
      BucketName: !Sub 'docs-${S3BucketName}'
      WebsiteConfiguration:
        ErrorDocument: '404.html'
        IndexDocument: 'index.html'
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      AccessControl: AwsExecRead
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      Tags:
        - Key: Servicio
          Value: !Sub '${AppName}'
        - Key: Environment
          Value: !Sub '${Environment}'
  RatesIngestionFunction:
    Type: AWS::Serverless::Function
    Condition: CreateRatesLambdaResources
    Properties:
      FunctionName: !Sub '${AppName}-${Environment}-rates-ingestion'
      Description: Saves site ratings JSON files into s3://dam.inspiraarte.com/rates/[uuid].json
      Runtime: nodejs24.x
      Handler: lambda-rates-handler.handler
      CodeUri:
        Bucket: !Ref DamBucketName
        Key: !Ref RatesLambdaCodeS3Key
        Version: !If
          - HasRatesLambdaCodeObjectVersion
          - !Ref RatesLambdaCodeS3ObjectVersion
          - !Ref 'AWS::NoValue'
      Architectures:
        - !Ref ArchitecturesVar
      MemorySize: !Ref RatesLambdaMemorySize
      Timeout: !Ref RatesLambdaTimeout
      Environment:
        Variables:
          RATES_BUCKET: !Ref DamBucket
          RATES_PREFIX: rates/
          RATES_API_KEY: !If
            - HasRatesLambdaApiKey
            - !Ref RatesLambdaApiKey
            - ""
          NEXT_GOOGLE_SECRET_KEY: !Ref NextGoogleSecretKey
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Sid: PutRatesObjects
              Effect: Allow
              Action:
                - 's3:PutObject'
              Resource: !Sub 'arn:aws:s3:::${DamBucket}/rates/*'
      Tags:
        Servicio: !Sub '${AppName}'
        Environment: !Sub '${Environment}'
  RatesIngestionFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: CreateRatesLambdaResources
    Properties:
      LogGroupName: !Sub '/aws/lambda/${RatesIngestionFunction}'
      RetentionInDays: 30
  RatesIngestionFunctionUrl:
    Type: AWS::Lambda::Url
    Condition: CreateRatesLambdaResources
    Properties:
      TargetFunctionArn: !GetAtt RatesIngestionFunction.Arn
      AuthType: NONE
      InvokeMode: BUFFERED
      Cors:
        AllowOrigins:
          - https://www.inspiraarte.com
          - http://localhost:3000
        AllowMethods:
          - POST
        AllowHeaders:
          - content-type
          - x-api-key
        MaxAge: 300
        AllowCredentials: false
  RatesIngestionFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Condition: CreateRatesLambdaResources
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref RatesIngestionFunction
      Principal: '*'
      FunctionUrlAuthType: NONE
  RatesIngestionInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: CreateRatesLambdaResources
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref RatesIngestionFunction
      Principal: '*'
      InvokedViaFunctionUrl: true
  ContactRequestsFunction:
    Type: AWS::Serverless::Function
    Condition: CreateContactLambdaResources
    Properties:
      FunctionName: !Sub '${AppName}-${Environment}-contact-requests'
      Description: Quote requests from /contacto into s3://dam.inspiraarte.com/contact/, HubSpot and Slack
      Runtime: nodejs24.x
      Handler: lambda-contact-handler.handler
      CodeUri:
        Bucket: !Ref DamBucketName
        Key: !Ref ContactLambdaCodeS3Key
        Version: !If
          - HasContactLambdaCodeObjectVersion
          - !Ref ContactLambdaCodeS3ObjectVersion
          - !Ref 'AWS::NoValue'
      Architectures:
        - !Ref ArchitecturesVar
      MemorySize: 256
      # Espera a HubSpot y Slack después de guardar en S3.
      Timeout: 20
      Environment:
        Variables:
          CONTACT_BUCKET: !Ref DamBucket
          CONTACT_PREFIX: contact/
          CONTACT_API_KEY: !Ref ContactLambdaApiKey
          NEXT_GOOGLE_SECRET_KEY: !Ref NextGoogleSecretKey
          HUBSPOT_API: !Ref HubspotApiToken
          SLACK_WEBHOOK_URL: !Ref SlackWebhookUrl
      Policies:
        - Version: '2012-10-17'
          Statement:
            # PutObject firma las subidas de adjuntos y guarda la solicitud;
            # GetObject permite confirmar (HeadObject) que cada adjunto existe.
            - Sid: ContactObjects
              Effect: Allow
              Action:
                - 's3:PutObject'
                - 's3:GetObject'
              Resource: !Sub 'arn:aws:s3:::${DamBucket}/contact/*'
      Tags:
        Servicio: !Sub '${AppName}'
        Environment: !Sub '${Environment}'
  ContactRequestsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: CreateContactLambdaResources
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ContactRequestsFunction}'
      RetentionInDays: 30
  ContactRequestsFunctionUrl:
    Type: AWS::Lambda::Url
    Condition: CreateContactLambdaResources
    Properties:
      TargetFunctionArn: !GetAtt ContactRequestsFunction.Arn
      AuthType: NONE
      InvokeMode: BUFFERED
      Cors:
        AllowOrigins:
          - !Ref ContactAllowedOrigin
          - http://localhost:3000
        AllowMethods:
          - POST
        AllowHeaders:
          - content-type
          - x-api-key
        MaxAge: 300
        AllowCredentials: false
  ContactRequestsFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Condition: CreateContactLambdaResources
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref ContactRequestsFunction
      Principal: '*'
      FunctionUrlAuthType: NONE
  # Requerido para Function URLs públicas; restringido a invocaciones vía la URL.
  ContactRequestsInvokeViaUrlPermission:
    Type: AWS::Lambda::Permission
    Condition: CreateContactLambdaResources
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ContactRequestsFunction
      Principal: '*'
      InvokedViaFunctionUrl: true
  RatesGlueDatabase:
    Type: AWS::Glue::Database
    Condition: CreateRatesLambdaResources
    Properties:
      CatalogId: !Ref 'AWS::AccountId'
      DatabaseInput:
        Name: !Ref RatesAthenaDatabaseName
        Description: Glue database for InspiraArte site rates
  RatesGlueTable:
    Type: AWS::Glue::Table
    Condition: CreateRatesLambdaResources
    DependsOn:
      - RatesGlueDatabase
    Properties:
      CatalogId: !Ref 'AWS::AccountId'
      DatabaseName: !Ref RatesGlueDatabase
      TableInput:
        Name: !Ref RatesAthenaTableName
        Description: External JSON table for s3://dam.inspiraarte.com/rates/
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: json
          EXTERNAL: 'TRUE'
        StorageDescriptor:
          Location: !Sub 's3://${DamBucket}/rates/'
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.IgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.openx.data.jsonserde.JsonSerDe
            Parameters:
              ignore.malformed.json: 'true'
          Columns:
            - Name: id
              Type: string
            - Name: name
              Type: string
            - Name: product
              Type: string
            - Name: description
              Type: string
            - Name: rating
              Type: int
            - Name: createdat
              Type: string
            - Name: status
              Type: int
            - Name: source
              Type: string
  RatesAthenaWorkGroup:
    Type: AWS::Athena::WorkGroup
    Condition: CreateRatesLambdaResources
    Properties:
      Name: !Sub '${AppName}-${Environment}-rates'
      Description: Athena workgroup for site ratings queries
      State: ENABLED
      RecursiveDeleteOption: true
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        PublishCloudWatchMetricsEnabled: true
        ResultConfiguration:
          OutputLocation: !Sub 's3://${DamBucket}/athena-results/rates/'
          EncryptionConfiguration:
            EncryptionOption: SSE_S3

Outputs:
  S3Bucket:
    Description: S3Bucket
    Value: !Ref 'S3Bucket'
  LastUpdate:
    Description: Fecha y hora de última actualización del template
    Value: !Ref 'LastUpdate'
  S3BucketPublicURL:
    Description: URL publica del bucket S3 principal
    Value: !Sub 'http://${S3Bucket}.s3-website-${AWS::Region}.amazonaws.com/'
  DamBucketPublicURL:
    Description: URL publica del bucket S3 principal
    Value: !Sub 'http://${DamBucket}.s3-website-${AWS::Region}.amazonaws.com/'
  S3BucketDocs:
    Description: S3BucketDocs
    Value: !Ref 'S3BucketDocs'
    Condition: CreateDocsResources
  S3BucketDocsPublicURL:
    Description: URL publica del bucket S3 de documentación
    Value: !Sub 'http://docs-${S3BucketName}.s3-website-${AWS::Region}.amazonaws.com/'
    Condition: CreateDocsResources
  DamBucketAccessUserName:
    Description: Nombre del usuario IAM con acceso a DamBucket
    Value: !Ref DamBucketAccessUser
  DamBucketAccessUserArn:
    Description: ARN del usuario IAM con acceso a DamBucket
    Value: !GetAtt DamBucketAccessUser.Arn
  RatesLambdaFunctionName:
    Description: Nombre de la lambda que recibe calificaciones
    Condition: CreateRatesLambdaResources
    Value: !Ref RatesIngestionFunction
  RatesLambdaFunctionArn:
    Description: ARN de la lambda que recibe calificaciones
    Condition: CreateRatesLambdaResources
    Value: !GetAtt RatesIngestionFunction.Arn
  RatesLambdaFunctionUrl:
    Description: URL publica para invocar la lambda de calificaciones
    Condition: CreateRatesLambdaResources
    Value: !GetAtt RatesIngestionFunctionUrl.FunctionUrl
  RatesAthenaWorkGroupName:
    Description: Athena workgroup to query rates JSON files
    Condition: CreateRatesLambdaResources
    Value: !Ref RatesAthenaWorkGroup
  RatesAthenaDatabase:
    Description: Glue database for rates analytics
    Condition: CreateRatesLambdaResources
    Value: !Ref RatesAthenaDatabaseName
  RatesAthenaTable:
    Description: Glue table for rates analytics
    Condition: CreateRatesLambdaResources
    Value: !Ref RatesAthenaTableName
  ContactLambdaFunctionName:
    Description: Nombre de la lambda que recibe solicitudes de cotizacion
    Condition: CreateContactLambdaResources
    Value: !Ref ContactRequestsFunction
  ContactLambdaFunctionUrl:
    Description: URL publica de la lambda de contacto (NEXT_PUBLIC_CONTACT_LAMBDA_URL)
    Condition: CreateContactLambdaResources
    Value: !GetAtt ContactRequestsFunctionUrl.FunctionUrl
